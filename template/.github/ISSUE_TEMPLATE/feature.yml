# From agent-kit. The template is where scope gets stopped before any code exists.
# Adapt the wording to the project's users.
name: Feature
description: Something a user can use. Written so an agent can build it without asking.
labels: [type:feature]
body:
  - type: textarea
    id: why
    attributes:
      label: Who it's for and why
      description: Which user, in which moment.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behaviour, one per line. This is what "done" is checked against.
      placeholder: |
        - Given … when … then …
        - …
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue must NOT do, even if it looks small.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test cases
      description: The cases that must have a test, including edge cases and failure paths.
  - type: textarea
    id: decisions
    attributes:
      label: Decisions already taken
      description: Product or technical choices settled for this issue, so the agent doesn't guess. Link ADRs or decision-log rows.
  - type: textarea
    id: data
    attributes:
      label: Data changes
      description: New tables, columns or stored data. The agent writes the migration; the owner applies it.
  - type: textarea
    id: manual-check
    attributes:
      label: What the owner checks by hand
      description: The parts an agent session can't verify (devices, real accounts, production).
