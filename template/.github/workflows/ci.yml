# Baseline CI from agent-kit. Replace the four commands with the project's own; keep them able to fail.
name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Branch protection requires this check by name: rename it there too.
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test
