# Generic labels for every repo that uses agent-kit.
# A repo adds its own area:* labels in its own file, on top.
#
# Labels hold only what can have several values per issue and is the repo's own
# (agent-kit issue-structure.md §5). Workflow state is the org issue field Stage,
# Priority is the org number field, and the kind of work is the issue type.

# --- Type: kept only until the issue forms set the issue type (agent-kit #147).
# Then they go too.
- name: 'type:feature'
  color: '1f6feb'
  description: Something a user can use
- name: 'type:bug'
  color: 'd73a4a'
  description: Something that behaves wrongly
- name: 'type:chore'
  color: '6e7781'
  description: Tooling, CI, dependencies, repo setup — nothing user-visible
- name: 'type:docs'
  color: '0075ca'
  description: Documentation only

# --- Area outside the product.
- name: 'area:harness'
  color: '5319e7'
  description: How agents work on this repo — CLAUDE.md, permissions, hooks, CI
