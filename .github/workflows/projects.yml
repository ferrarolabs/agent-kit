name: Projects

# Runs scripts/projects/build-project.js with an org token. Cloud sessions can't reach
# GraphQL or org paths, but they can dispatch this workflow and read its run (issue 83).
# Guide: docs/guides/run-project-scripts-from-a-cloud-session.md
#
# The sync (issue 175) keeps every board in scripts/projects/projects.json in line with the spec:
# on every push to main that touches the project scripts, every night, or dispatched with mode sync.

on:
  push:
    branches: [main]
    paths:
      - "scripts/projects/**"
      - ".github/workflows/projects.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check changes nothing; build creates what is missing; sync runs on every registered board"
        type: choice
        options: [check, build, sync]
        default: check
      title:
        description: "Project title, e.g. Agent work or Jamly (not used by sync)"
        type: string
        default: ""
      repo:
        description: "Repo in ferrarolabs the project belongs to. Empty = the org template (--template)"
        type: string
        default: ""
      extra:
        description: "Also apply the repo's .github/project-extra-views.json"
        type: boolean
        default: false
      prune:
        description: "Template only, with build: delete views and project fields the spec doesn't name (one-off)"
        type: boolean
        default: false
      from_template:
        description: "Repo projects only, with build: copy the org template \"Agent work\" if the project doesn't exist yet"
        type: boolean
        default: false

permissions:
  contents: read

# Two runs writing the same project at once would race on its views.
# A branch run waits for Elia's approval, and a waiting run holds its group:
# so branch runs get their own group, and never block the nightly run from main (issue 176).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'projects' || 'projects-branch' }}
  cancel-in-progress: false

jobs:
  run:
    name: build-project.js
    # One project, by hand. Push and schedule have no inputs: they always mean sync.
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The org token lives only in environment secrets (issue 173, ADR 0026).
    # `projects` allows only main. A branch run asks for `projects-branch`, which needs Elia's approval.
    environment: ${{ github.ref == 'refs/heads/main' && 'projects' || 'projects-branch' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the token and the inputs
        # Inputs reach the shell only as environment variables, never as ${{ }} inside the script.
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'projects' || 'projects-branch' }}
          MODE: ${{ inputs.mode }}
          TITLE: ${{ inputs.title }}
          REPO: ${{ inputs.repo }}
          EXTRA: ${{ inputs.extra }}
          PRUNE: ${{ inputs.prune }}
          FROM_TEMPLATE: ${{ inputs.from_template }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The PROJECT_TOKEN secret is empty or missing in the $ENV_NAME environment. Only Elia can add it: Settings > Environments (issue 173)."
            exit 1
          fi
          case "$MODE" in check|build) ;; *) echo "::error::mode must be check or build"; exit 1 ;; esac
          if ! printf '%s' "$TITLE" | grep -Eq '^[A-Za-z0-9 ._-]{1,64}$'; then
            echo "::error::title must be 1-64 letters, digits, spaces, dots, dashes or underscores"
            exit 1
          fi
          if [ -n "$REPO" ] && ! printf '%s' "$REPO" | grep -Eq '^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}$'; then
            echo "::error::repo must be a bare repo name in ferrarolabs, e.g. jamly"
            exit 1
          fi
          if [ "$EXTRA" = "true" ] && [ -z "$REPO" ]; then
            echo "::error::extra needs a repo: the org template has no extra views"
            exit 1
          fi
          if [ "$PRUNE" = "true" ] && { [ -n "$REPO" ] || [ "$MODE" != "build" ]; }; then
            echo "::error::prune is for the template only, with mode build: repo projects are never pruned"
            exit 1
          fi
          if [ "$FROM_TEMPLATE" = "true" ] && { [ -z "$REPO" ] || [ "$MODE" != "build" ]; }; then
            echo "::error::from_template needs a repo and mode build"
            exit 1
          fi

      - name: Fetch the repo's extra views
        if: inputs.extra
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ inputs.repo }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/ferrarolabs/$REPO/contents/.github/project-extra-views.json" > "$RUNNER_TEMP/extra-views.json"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$RUNNER_TEMP/extra-views.json"

      - name: Run build-project.js
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          MODE: ${{ inputs.mode }}
          TITLE: ${{ inputs.title }}
          REPO: ${{ inputs.repo }}
          EXTRA: ${{ inputs.extra }}
          PRUNE: ${{ inputs.prune }}
          FROM_TEMPLATE: ${{ inputs.from_template }}
        run: |
          set -- --owner ferrarolabs --title "$TITLE"
          if [ -n "$REPO" ]; then set -- "$@" --repo "$REPO"; else set -- "$@" --template; fi
          if [ "$EXTRA" = "true" ]; then set -- "$@" --extra "$RUNNER_TEMP/extra-views.json"; fi
          if [ "$PRUNE" = "true" ]; then set -- "$@" --prune; fi
          # The template's title is fixed here, never an input.
          if [ "$FROM_TEMPLATE" = "true" ]; then set -- "$@" --from-template "Agent work"; fi
          if [ "$MODE" = "check" ]; then set -- "$@" --check; fi
          echo "node scripts/projects/build-project.js $*"
          status=0
          node scripts/projects/build-project.js "$@" > "$RUNNER_TEMP/out.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/out.txt"
          {
            echo "### build-project.js · $MODE · $TITLE"
            echo '```text'
            cat "$RUNNER_TEMP/out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  sync:
    name: sync every board
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref == 'refs/heads/main' && 'projects' || 'projects-branch' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the token
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The PROJECT_TOKEN secret is empty or missing in this run's environment. Only Elia can add it: Settings > Environments (issue 173)."
            exit 1
          fi

      - name: Sync the boards
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/projects/sync-projects.js --out "$RUNNER_TEMP/results.json"

      - name: Report what needs Elia
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/projects/report-sync.js "$RUNNER_TEMP/results.json"
